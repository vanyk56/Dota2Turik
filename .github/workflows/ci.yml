# [Phase: MVP v1] GitHub Actions CI Pipeline
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dota2_tournaments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dota2_tournaments_test?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STEAM_API_KEY: test_steam_api_key_placeholder
      STRATZ_TOKEN: test_stratz_token_placeholder
      SESSION_SECRET: ci_test_session_secret_minimum_32_characters_long

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm run test

      - name: Build Next.js application
        run: npm run build
